<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Corner floral motif -->
  <g fill="none" stroke="#C9A66B" stroke-width="1.2" opacity="0.8">
    <!-- Main branch -->
    <path d="M0 0 Q40 60 80 100 Q120 140 160 160"/>
    <path d="M0 0 Q60 40 100 80 Q140 120 160 160"/>

    <!-- Leaves -->
    <path d="M30 40 Q40 20 50 35 Q40 45 30 40Z" fill="#C9A0A0" fill-opacity="0.3"/>
    <path d="M55 65 Q70 45 80 60 Q68 75 55 65Z" fill="#C9A0A0" fill-opacity="0.3"/>
    <path d="M40 55 Q55 38 65 55 Q52 68 40 55Z" fill="#C9A0A0" fill-opacity="0.25"/>
    <path d="M80 95 Q98 78 105 95 Q93 108 80 95Z" fill="#C9A0A0" fill-opacity="0.3"/>
    <path d="M100 115 Q118 100 125 118 Q112 128 100 115Z" fill="#C9A0A0" fill-opacity="0.25"/>

    <!-- Flowers -->
    <circle cx="20" cy="20" r="8" fill="#F4D9D0" fill-opacity="0.5" stroke="#C9A66B"/>
    <circle cx="20" cy="20" r="3" fill="#C9A66B" fill-opacity="0.4"/>

    <circle cx="65" cy="80" r="10" fill="#F4D9D0" fill-opacity="0.4" stroke="#C9A66B"/>
    <circle cx="65" cy="80" r="4" fill="#C9A66B" fill-opacity="0.4"/>

    <circle cx="110" cy="130" r="7" fill="#F4D9D0" fill-opacity="0.4" stroke="#C9A66B"/>
    <circle cx="110" cy="130" r="3" fill="#C9A66B" fill-opacity="0.4"/>

    <circle cx="140" cy="150" r="9" fill="#F4D9D0" fill-opacity="0.35" stroke="#C9A66B"/>
    <circle cx="140" cy="150" r="3.5" fill="#C9A66B" fill-opacity="0.3"/>

    <!-- Small buds -->
    <circle cx="10" cy="10" r="3" fill="#C9A0A0" fill-opacity="0.4"/>
    <circle cx="45" cy="48" r="3" fill="#C9A0A0" fill-opacity="0.3"/>
    <circle cx="90" cy="105" r="3" fill="#C9A0A0" fill-opacity="0.3"/>
    <circle cx="130" cy="142" r="2.5" fill="#C9A0A0" fill-opacity="0.3"/>

    <!-- Curls -->
    <path d="M15 30 Q5 25 10 15" stroke-width="0.8"/>
    <path d="M50 70 Q42 62 48 52" stroke-width="0.8"/>
    <path d="M120 138 Q112 130 118 120" stroke-width="0.8"/>
  </g>
</svg>
